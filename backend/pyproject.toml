[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitara-backend"
version = "0.1.0"
description = "SITARA internal meeting follow-up system API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.140.8,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pwdlib[argon2]>=0.2.1,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "clamd>=1.0.2,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=6.0,<7.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<3.0",
  "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/main.py",
  "*legacy_prototype.py", # Reference mappings, not loaded at runtime.
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["clamd"]
ignore_missing_imports = true