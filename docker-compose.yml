services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sitara_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sitara_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}

    volumes:
      - sitara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitara_app} -d ${POSTGRES_DB:-sitara_dev}"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_database:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    security_opt:
      - no-new-privileges:true

  evidence-scanner:
    build:
      context: ./backend
    working_dir: /app
    command: ["python", "-m", "app.evidence_scanner_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${SCANNER_DATABASE_URL:-postgresql+psycopg://sitara_app:change_me_local_only@postgres:5432/sitara_dev}
      ACTION_ITEM_EVIDENCE_STORAGE_PATH: /var/lib/sitara/evidence
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_SECONDS: 30
      EVIDENCE_SCAN_POLL_SECONDS: 5
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/evidence:/var/lib/sitara/evidence:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  sitara_postgres_data:
  clamav_database:
